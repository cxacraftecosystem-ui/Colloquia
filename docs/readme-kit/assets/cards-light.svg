<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="What Colloquia does: record, keep offline, transcribe, analyse, ask and send">
<title>What Colloquia does: record, keep offline, transcribe, analyse, ask and send</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.shine{animation:shine 5.6s cubic-bezier(.5,0,.3,1) infinite}@keyframes shine{0%{transform:translateX(0)}45%,100%{transform:translateX(562.7px)}}.r0{animation-delay:0.1s}.r1{animation-delay:0.2s}.r2{animation-delay:0.3s}.r3{animation-delay:0.5s}.r4{animation-delay:0.6s}.r5{animation-delay:0.7s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<radialGradient id="halo"><stop offset="0" stop-color="#AA69E9" stop-opacity=".16"/><stop offset="1" stop-color="#AA69E9" stop-opacity="0"/></radialGradient>
<linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#762CB1" stop-opacity="0"/><stop offset=".5" stop-color="#762CB1"/><stop offset="1" stop-color="#CD9200" stop-opacity="0"/></linearGradient>
<clipPath id="k0"><rect x="6" y="6" width="382.7" height="214" rx="18"/></clipPath>
<clipPath id="k1"><rect x="408.7" y="6" width="382.7" height="214" rx="18"/></clipPath>
<clipPath id="k2"><rect x="811.3" y="6" width="382.7" height="214" rx="18"/></clipPath>
<clipPath id="k3"><rect x="6" y="240" width="382.7" height="214" rx="18"/></clipPath>
<clipPath id="k4"><rect x="408.7" y="240" width="382.7" height="214" rx="18"/></clipPath>
<clipPath id="k5"><rect x="811.3" y="240" width="382.7" height="214" rx="18"/></clipPath>
</defs>
<g class="rise r0">
<rect x="6" y="6" width="382.7" height="214" rx="18" fill="#FFFFFF" stroke="#E4E2EF"/>
<g clip-path="url(#k0)"><circle cx="358.7" cy="26" r="120" fill="url(#halo)"/><rect x="6" y="6" width="382.7" height="3" fill="#E7D5FE"/><rect class="shine" style="animation-delay:0s" x="-174" y="6" width="180" height="3" fill="url(#glint)"/></g>
<rect x="30" y="30" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(42 42) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></g>
<text x="364.7" y="52" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">RECORD</text>
<text x="30" y="116" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Record or import</text>
<text x="30" y="146" class="s" fill="#615D7A" font-size="15">Pause, resume and keep recording in the</text><text x="30" y="169" class="s" fill="#615D7A" font-size="15">background, or import audio or video,</text><text x="30" y="192" class="s" fill="#615D7A" font-size="15">cut to audio on the phone.</text>
</g>
<g class="rise r1">
<rect x="408.7" y="6" width="382.7" height="214" rx="18" fill="#FFFFFF" stroke="#E4E2EF"/>
<g clip-path="url(#k1)"><circle cx="761.3" cy="26" r="120" fill="url(#halo)"/><rect x="408.7" y="6" width="382.7" height="3" fill="#E7D5FE"/><rect class="shine" style="animation-delay:0.7s" x="228.7" y="6" width="180" height="3" fill="url(#glint)"/></g>
<rect x="432.7" y="30" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(444.7 42) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></g>
<text x="767.3" y="52" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">OFFLINE</text>
<text x="432.7" y="116" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Nothing lost offline</text>
<text x="432.7" y="146" class="s" fill="#615D7A" font-size="15">A failed upload waits on the phone in an</text><text x="432.7" y="169" class="s" fill="#615D7A" font-size="15">outbox and goes up when the library</text><text x="432.7" y="192" class="s" fill="#615D7A" font-size="15">opens or you tap Upload now.</text>
</g>
<g class="rise r2">
<rect x="811.3" y="6" width="382.7" height="214" rx="18" fill="#FFFFFF" stroke="#E4E2EF"/>
<g clip-path="url(#k2)"><circle cx="1164" cy="26" r="120" fill="url(#halo)"/><rect x="811.3" y="6" width="382.7" height="3" fill="#E7D5FE"/><rect class="shine" style="animation-delay:1.4s" x="631.3" y="6" width="180" height="3" fill="url(#glint)"/></g>
<rect x="835.3" y="30" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(847.3 42) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></g>
<text x="1170" y="52" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">TRANSCRIBE</text>
<text x="835.3" y="116" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Speakers and languages</text>
<text x="835.3" y="146" class="s" fill="#615D7A" font-size="15">Deepgram nova-3 labels each speaker and</text><text x="835.3" y="169" class="s" fill="#615D7A" font-size="15">follows code-switching; Whisper takes</text><text x="835.3" y="192" class="s" fill="#615D7A" font-size="15">over when Deepgram fails.</text>
</g>
<g class="rise r3">
<rect x="6" y="240" width="382.7" height="214" rx="18" fill="#FFFFFF" stroke="#E4E2EF"/>
<g clip-path="url(#k3)"><circle cx="358.7" cy="260" r="120" fill="url(#halo)"/><rect x="6" y="240" width="382.7" height="3" fill="#E7D5FE"/><rect class="shine" style="animation-delay:2.1s" x="-174" y="240" width="180" height="3" fill="url(#glint)"/></g>
<rect x="30" y="264" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(42 276) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></g>
<text x="364.7" y="286" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">ANALYSE</text>
<text x="30" y="350" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">One AI pass</text>
<text x="30" y="380" class="s" fill="#615D7A" font-size="15">gpt-4o-mini writes the title, clean</text><text x="30" y="403" class="s" fill="#615D7A" font-size="15">dialogue, English copy, summary, actions</text><text x="30" y="426" class="s" fill="#615D7A" font-size="15">and topics in one call.</text>
</g>
<g class="rise r4">
<rect x="408.7" y="240" width="382.7" height="214" rx="18" fill="#FFFFFF" stroke="#E4E2EF"/>
<g clip-path="url(#k4)"><circle cx="761.3" cy="260" r="120" fill="url(#halo)"/><rect x="408.7" y="240" width="382.7" height="3" fill="#E7D5FE"/><rect class="shine" style="animation-delay:2.8s" x="228.7" y="240" width="180" height="3" fill="url(#glint)"/></g>
<rect x="432.7" y="264" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(444.7 276) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
<text x="767.3" y="286" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">ASK</text>
<text x="432.7" y="350" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Chat and search</text>
<text x="432.7" y="380" class="s" fill="#615D7A" font-size="15">Chat with one transcript, ask across all</text><text x="432.7" y="403" class="s" fill="#615D7A" font-size="15">of them, and search by keyword, or by</text><text x="432.7" y="426" class="s" fill="#615D7A" font-size="15">meaning with lite mode off.</text>
</g>
<g class="rise r5">
<rect x="811.3" y="240" width="382.7" height="214" rx="18" fill="#FFFFFF" stroke="#E4E2EF"/>
<g clip-path="url(#k5)"><circle cx="1164" cy="260" r="120" fill="url(#halo)"/><rect x="811.3" y="240" width="382.7" height="3" fill="#E7D5FE"/><rect class="shine" style="animation-delay:3.5s" x="631.3" y="240" width="180" height="3" fill="url(#glint)"/></g>
<rect x="835.3" y="264" width="48" height="48" rx="14" fill="#F9F5FF" stroke="#E7D5FE"/>
<g transform="translate(847.3 276) scale(1)" fill="none" stroke="#762CB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></g>
<text x="1170" y="286" class="m" fill="#615D7A" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="end">SEND</text>
<text x="835.3" y="350" class="d" fill="#1E1B2E" font-size="20" font-weight="700" letter-spacing="-.3">Where work happens</text>
<text x="835.3" y="380" class="s" fill="#615D7A" font-size="15">Action items to Google Calendar and</text><text x="835.3" y="403" class="s" fill="#615D7A" font-size="15">Tasks; notes to Slack, Teams, Notion,</text><text x="835.3" y="426" class="s" fill="#615D7A" font-size="15">Trello, Jira or a webhook.</text>
</g>
</svg>
